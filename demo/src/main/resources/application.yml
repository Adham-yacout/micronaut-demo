micronaut:
  application:
    name: demo
  server:
    port: 8080
  security:
    authentication: bearer
    intercept-url-map:
      - pattern: /auth/token
        http-method: POST
        access:
          - isAnonymous()
      - pattern: /products/**
        access:
          - isAuthenticated()
    token:
      jwt:
        claims-validators:
          expiration: true
        signatures:
          secret:
            generator:
              secret: "${JWT_GENERATOR_SIGNATURE_SECRET}"
              jws-algorithm: HS256

datasources:
  default:
    url: jdbc:postgresql://127.0.0.1:5433/micronaut_db
    username: micronaut_user
    password: micronaut_pass
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
flyway:
  datasources:
    default:
      enabled: true
jpa:
  default:
    entity-scan:
      packages:
        - com.example
    properties:
      hibernate:
        hbm2ddl:
          auto: validate
        show_sql: true
        format_sql: true