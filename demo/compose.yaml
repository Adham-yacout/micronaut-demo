services:
  postgres:
    image: postgres:17
    container_name: micronaut-postgress
    environment:
      POSTGRES_DB: micronaut_db
      POSTGRES_USER: micronaut_user
      POSTGRES_PASSWORD: micronaut_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: